name: Build zlf-godot-editor (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned godotengine/godot master commit (4.8-dev). Bump deliberately.
  GODOT_BASE_SHA: 232e6b14abf6e590b41d60f11704e42de22bff72

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out zlf-godot-editor
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev \
            libwayland-dev wayland-protocols \
            python3 python3-pip
          pip3 install --break-system-packages scons

      - name: Clone Godot at pinned base
        run: |
          git init godot && cd godot
          git remote add origin https://github.com/godotengine/godot.git
          git fetch --depth 1 origin "$GODOT_BASE_SHA"
          git checkout FETCH_HEAD
          git log --oneline -1

      - name: Apply performance patches
        run: |
          cd godot
          git config user.email "zlf-godot-editor@local"
          git config user.name "zlf-godot-editor"
          git am ../patches/*.patch
          git log --oneline -12

      - name: Build editor
        run: |
          cd godot
          scons platform=linuxbsd target=editor -j"$(nproc)"
          ls -la bin/

      - name: Rename binary
        run: |
          cp godot/bin/godot.linuxbsd.editor.x86_64 ./zlf-godot-editor-linux-x86_64
          chmod +x ./zlf-godot-editor-linux-x86_64
          ls -la ./zlf-godot-editor-linux-x86_64

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: zlf-godot-editor-linux-x86_64
          body: |
            Custom Godot 4.8-dev editor for Linux with cherry-picked performance PRs.
            See cherry-picks.txt for the exact base commit and PR list.
